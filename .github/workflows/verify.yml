name: Verify synthetic workflow
on: [push, pull_request]
permissions:
  contents: read
jobs:
  counting-engine:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.5'
          python-version: '3.12.14'
      - name: Install locked CPU counting test dependencies
        shell: pwsh
        run: |
          uv venv --python 3.12.14 .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip sync counting-tests.lock --python ./.venv/Scripts/python.exe --require-hashes
      - name: Native geometry and compartment tests
        run: ./.venv/Scripts/python.exe -m pytest tests/test_counting_engine.py tests/test_experimental_dynamic_owned.py tests/test_counting_surface_fill.py tests/test_counting_crop_support.py tests/test_counting_grids.py tests/test_counting_quality.py tests/test_counting_adaptive.py tests/test_counting_adaptive_resources.py tests/test_counting_adaptive_models.py tests/test_counting_research_localization.py tests/test_research_proxy.py tests/test_research_v5.py tests/test_counting_diagnostic_trace.py tests/test_reproduce_clinician_counts.py tests/test_instance_learning.py tests/test_instance_experiment.py tests/test_instance_connectivity.py -p no:cacheprovider -q
      - name: Synthetic wall research controls
        run: ./.venv/Scripts/python.exe -m pytest tests/test_synthetic_walls.py tests/test_wall_proposals.py tests/test_wall_learning.py tests/test_wall_benchmark.py tests/test_train_wall_proposal_model.py -m 'not integration' -p no:cacheprovider -q
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked application dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe -m pip install --require-hashes -r requirements.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe -m pip install --no-build-isolation --no-deps -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix web ci
      - name: Production build
        run: npm --prefix web run build
      - name: Python synthetic tests
        run: ./.venv/Scripts/python.exe -m pytest -p no:cacheprovider -q -m 'not integration'
      - name: Frontend tests
        run: npm --prefix web test
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.5'
      - name: Real counting worker integration
        shell: pwsh
        run: |
          uv venv --python 3.12.14 .engine-tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip sync counting-tests.lock --python ./.engine-tests/Scripts/python.exe --require-hashes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:ETHMOID_ENGINE_TEST_PYTHON = (Resolve-Path ./.engine-tests/Scripts/python.exe).Path
          ./.venv/Scripts/python.exe -m pytest tests/test_assisted_integration.py -p no:cacheprovider -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe -m pytest tests/test_research_v5_app.py -m integration -p no:cacheprovider -q
      - name: Install isolated Chromium for browser checks
        working-directory: web
        run: npm exec playwright install chromium
      - name: Synthetic browser workflow
        run: npm --prefix web run test:e2e
      - name: Dependency audit
        run: npm --prefix web audit --audit-level=moderate
      - name: Inspect tracked blobs with the medical-data guard
        run: ./.venv/Scripts/python.exe scripts/check_staged.py --all-tracked
