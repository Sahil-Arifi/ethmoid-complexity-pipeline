name: Verify synthetic workflow
on: [push, pull_request]
permissions:
  contents: read
jobs:
  counting-engine:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.5'
          python-version: '3.12.14'
      - name: Install locked CPU counting test dependencies
        shell: pwsh
        run: |
          uv venv --python 3.12.14 .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip sync counting-tests.lock --python ./.venv/Scripts/python.exe --require-hashes
      - name: Native geometry and compartment tests
        run: ./.venv/Scripts/python.exe -m pytest tests/test_counting_engine.py tests/test_counting_grids.py tests/test_counting_quality.py tests/test_synthetic_counting_experiment.py tests/test_synthetic_blur_experiment.py tests/test_synthetic_faint_wall_candidate.py tests/test_synthetic_faint_wall_cases.py tests/test_synthetic_faint_wall_experiment.py tests/test_ridge_counting_candidate.py tests/test_ridge_stress_cases.py tests/test_ridge_counting_experiment.py tests/test_ridge_communication_guard.py tests/test_native_passage_evidence.py tests/test_native_passage_cases.py tests/test_native_passage_experiment.py tests/test_canonical_ridge_candidate.py tests/test_component_communication_guard.py tests/test_canonical_counting_experiment.py tests/test_aperture_observation_model.py tests/test_aperture_identifiability_experiment.py tests/test_sampling_information_model.py tests/test_sampling_information_experiment.py tests/test_evaluation_scoring.py tests/test_saturated_barrier_candidate.py tests/test_counter_failure_experiment.py -p no:cacheprovider -q
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked application dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          ./.venv/Scripts/python.exe -m pip install --require-hashes -r requirements.lock
          ./.venv/Scripts/python.exe -m pip install --no-build-isolation --no-deps -e .
          npm --prefix web ci
      - name: Production build
        run: npm --prefix web run build
      - name: Python synthetic tests
        run: ./.venv/Scripts/python.exe -m pytest -p no:cacheprovider -q -m 'not integration'
      - name: Frontend tests
        run: npm --prefix web test
      - name: Install isolated Chromium for browser checks
        working-directory: web
        run: npm exec playwright install chromium
      - name: Synthetic browser workflow
        run: npm --prefix web run test:e2e
      - name: Dependency audit
        run: npm --prefix web audit --audit-level=moderate
      - name: Inspect tracked blobs with the medical-data guard
        run: ./.venv/Scripts/python.exe scripts/check_staged.py --all-tracked
