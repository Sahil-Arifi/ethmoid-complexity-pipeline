[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ethmoid-complexity-pipeline"
version = "0.1.0"
description = "Local, PHI-aware DICOM to NIfTI conversion and QC pilot"
requires-python = "==3.13.*"
dependencies = [
  "nibabel==5.3.2",
  "numpy==2.3.5",
  "pydicom==3.0.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
ethmoid-pipeline = "ethmoid_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: invokes the pinned local dcm2niix executable",
]
